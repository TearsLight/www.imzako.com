spring.application.name=imzako

# =============================================================================
# 配置来源
# .env 保存部署配置，应用启动时强制读取（缺失则启动失败）；
# .env.local 是可选、已忽略版本控制的本地覆盖文件（见 docs/deployment.md）。
# =============================================================================
spring.config.import=file:.env[.properties],optional:file:.env.local[.properties]

# =============================================================================
# 服务器与公开地址
# =============================================================================
server.port=${SERVER_PORT:8080}
app.public-url=${PUBLIC_URL:https://www.imzako.com}

# =============================================================================
# 请求与响应编码
# =============================================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =============================================================================
# MongoDB
# =============================================================================
spring.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/imzako}

# =============================================================================
# 会话 Cookie
# =============================================================================
server.servlet.session.timeout=${SESSION_TTL_SECONDS:86400}s
server.servlet.session.cookie.name=${COOKIE_NAME:IMZAKO_SESSION}
server.servlet.session.cookie.path=${COOKIE_PATH:/}
server.servlet.session.cookie.http-only=${COOKIE_HTTP_ONLY:true}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}

# =============================================================================
# 邮件发送
# 生产走 BillionMail API（由 MAIL_TRANSPORT 决定）；SMTP 仅作本地回退，
# 未配置 SMTP_HOST 时不再注入 JavaMailSender，因此应用可以只依赖 BillionMail 运行。
# =============================================================================
app.mail.transport=${MAIL_TRANSPORT:smtp}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_TIMEOUT_MS:10000}
app.mail.sender=${SENDER:no-reply@localhost}
app.mail.sender-name=${SENDER_NAME:imzako}
app.mail.billionmail.base-url=${BILLIONMAIL_API_URL:https://webmail.imzako.com}
app.mail.billionmail.api-key=${BILLIONMAIL_API_KEY:}
app.mail.billionmail.timeout=${BILLIONMAIL_TIMEOUT_MS:10000}ms

# =============================================================================
# 账号门禁（默认关闭；在 .env 中用大写变量开启）
# =============================================================================
app.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
app.captcha.enabled=${CAPTCHA_ENABLED:false}

# =============================================================================
# RCON 管理端口
# 默认只监听回环地址，远程使用请走 SSH 隧道；Docker 发布端口时才用 0.0.0.0。
# =============================================================================
app.rcon.enabled=${RCON_ENABLED:true}
app.rcon.host=${RCON_HOST:127.0.0.1}
app.rcon.port=${RCON_PORT:8090}
app.rcon.token=${RCON_TOKEN:}
