spring.application.name=imzako-test
# Tests must never import deployment credentials from the repository-root .env.
spring.config.import=
spring.mongodb.uri=mongodb://127.0.0.1:27017/imzako-test
app.mongodb.initialize=false
app.rcon.enabled=false
app.email-verification.enabled=false
app.captcha.enabled=false
app.public-url=http://localhost
app.mail.transport=smtp
app.mail.sender=no-reply@localhost
app.mail.sender-name=imzako-test
app.mail.billionmail.base-url=http://localhost
app.mail.billionmail.api-key=
app.mail.billionmail.timeout=1s
spring.mail.host=localhost
logging.level.org.mongodb.driver=OFF
